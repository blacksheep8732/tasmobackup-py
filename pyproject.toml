[project]
name = "tasmobackup-py"
version = "0.3.0"
description = "Backup and (opt-in) auto-update for Tasmota/WLED devices — a modern Python rewrite of TasmoBackup"
requires-python = ">=3.11"
# Upper bounds stop the image build from silently picking up a new major version
# with a different API (APScheduler 4 is a complete rewrite and already in alpha).
# This list is also what the Dockerfile installs — keep it the single source.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12,<1",
    "itsdangerous>=2.2,<3",
    "cryptography>=43.0",
    "bcrypt>=4.2,<6",
    "aiomqtt>=2.3,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "Pillow>=10.0",   # only for scripts/make_icon.py
]

# Only app/ is the Python package — templates/ (Unraid XML) and data/ are not.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
