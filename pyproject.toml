[project]
name = "tasmobackup-py"
version = "0.1.0"
description = "Backup and (opt-in) auto-update for Tasmota/WLED devices — a modern Python rewrite of TasmoBackup"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
    "bcrypt>=4.2",
    "aiomqtt>=2.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "Pillow>=10.0",   # only for scripts/make_icon.py
]

# Only app/ is the Python package — templates/ (Unraid XML) and data/ are not.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
