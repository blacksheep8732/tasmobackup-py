services:
  tasmobackup:
    build: .
    image: tasmobackup-py:latest
    container_name: tasmobackup
    ports:
      - "8259:8000"
    volumes:
      - ./data:/data
    environment:
      # IMPORTANT: set a stable random secret (used for sessions AND to encrypt
      # stored device passwords). Generate with: openssl rand -hex 32
      - TB_SECRET_KEY=${TB_SECRET_KEY:?set TB_SECRET_KEY in .env}
      - TB_ADMIN_USER=${TB_ADMIN_USER:-admin}
      - TB_ADMIN_PASSWORD=${TB_ADMIN_PASSWORD:-admin}
      # Default Tasmota credentials used when a device has none of its own.
      - TB_TASMOTA_USER=${TB_TASMOTA_USER:-admin}
      - TB_TASMOTA_PASSWORD=${TB_TASMOTA_PASSWORD:-}
      - TZ=${TZ:-Europe/Berlin}
    labels:
      # Unraid Docker integration: WebUI button + container icon.
      # [IP] and [PORT:8000] are substituted by Unraid with the host IP and mapped port.
      - "net.unraid.docker.webui=http://[IP]:[PORT:8000]/"
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/blacksheep8732/tasmobackup-py/main/app/static/icon.png"
    restart: unless-stopped
