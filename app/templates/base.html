<!DOCTYPE html>
<html lang="{{ lang|default('de') }}" data-theme="{{ theme|default('auto') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TasmoBackup{% block title %}{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { --bg:#f5f6f8; --fg:#1c1e21; --card:#fff; --border:#dadde1; --muted:#65676b;
            --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --danger:#dc2626; }
    @media (prefers-color-scheme: dark) {
      html[data-theme="auto"] { --bg:#18191a; --fg:#e4e6eb; --card:#242526; --border:#3a3b3c; --muted:#b0b3b8; }
    }
    html[data-theme="dark"] { --bg:#18191a; --fg:#e4e6eb; --card:#242526; --border:#3a3b3c; --muted:#b0b3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; align-items:center; gap:1rem; padding:.8rem 1.2rem; background:var(--card);
             border-bottom:1px solid var(--border); }
    header h1 { font-size:1.1rem; margin:0; }
    header nav { margin-left:auto; display:flex; gap:1rem; }
    a { color:var(--accent); text-decoration:none; }
    main { max-width:1100px; margin:1.2rem auto; padding:0 1rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:.45rem .5rem; text-align:left; border-bottom:1px solid var(--border); font-size:.88rem; }
    th { color:var(--muted); font-weight:600; }
    .btn { display:inline-block; padding:.35rem .7rem; border-radius:6px; border:1px solid var(--border);
           background:var(--card); color:var(--fg); cursor:pointer; font-size:.82rem; }
    .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn-ok { background:var(--ok); color:#fff; border-color:var(--ok); }
    .btn-warn { background:var(--warn); color:#fff; border-color:var(--warn); }
    .btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }
    .pill { padding:.15rem .5rem; border-radius:999px; font-size:.72rem; font-weight:600; }
    .pill-ok { background:rgba(22,163,74,.15); color:var(--ok); }
    .pill-warn { background:rgba(217,119,6,.15); color:var(--warn); }
    .pill-danger { background:rgba(220,38,38,.15); color:var(--danger); }
    .dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; margin-right:.35rem; }
    .dot-on { background:var(--ok); }
    .dot-off { background:var(--danger); }
    .badge { display:inline-block; min-width:1.1rem; padding:0 .35rem; border-radius:999px;
             background:var(--danger); color:#fff; font-size:.7rem; font-weight:700; text-align:center; }
    .flash { padding:.6rem .9rem; border-radius:8px; margin-bottom:.6rem; font-size:.88rem;
             border:1px solid transparent; }
    .flash-info { background:rgba(22,163,74,.12); border-color:var(--ok); color:var(--ok); }
    .flash-warn { background:rgba(217,119,6,.12); border-color:var(--warn); color:var(--warn); }
    .flash-error { background:rgba(220,38,38,.12); border-color:var(--danger); color:var(--danger); }
    .banner { display:flex; align-items:center; gap:.6rem; padding:.7rem .9rem; border-radius:8px;
              background:rgba(220,38,38,.12); border:1px solid var(--danger); margin-bottom:1rem; }
    .banner-warn { background:rgba(217,119,6,.12); border-color:var(--warn); }
    .muted { color:var(--muted); font-size:.8rem; }
    /* Device table: two lines per cell — a main value and a quieter detail line. */
    .devices td { vertical-align:top; }
    .cell-main { line-height:1.35; }
    .cell-sub { color:var(--muted); font-size:.76rem; line-height:1.35; margin-top:.1rem; }
    .cell-sub a { color:var(--muted); text-decoration:underline; }
    .nowrap { white-space:nowrap; }
    .sep { opacity:.5; margin:0 .15rem; }
    .txt-ok { color:var(--ok); font-weight:600; }
    .txt-danger { color:var(--danger); font-weight:600; }
    .txt-warn { color:var(--warn); font-weight:600; }
    code { font-size:.78rem; background:var(--bg); border:1px solid var(--border);
           border-radius:4px; padding:.1rem .3rem; word-break:break-all; }
    /* Actions: fixed 2x2 grid so rows line up instead of reflowing per device. */
    .actions { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));
               gap:.3rem; min-width:12.5rem; }
    /* The forms are the grid items themselves — no display:contents, which some
       browsers handle badly on <form>. */
    .actions > form { margin:0; }
    .actions .btn { display:block; width:100%; text-align:center; padding:.3rem .4rem; }
    input, select { padding:.4rem .5rem; border:1px solid var(--border); border-radius:6px;
                    background:var(--bg); color:var(--fg); }
    form.inline { display:inline; }
    .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  </style>
</head>
<body>
  {% block header %}
  <header>
    <h1>🔌 TasmoBackup</h1>
    <nav>
      <a href="/">{{ t('nav.devices') }}</a>
      <a href="/events">{{ t('nav.events') }}{% if unseen_events %} <span class="badge">{{ unseen_events }}</span>{% endif %}</a>
      <a href="/settings">{{ t('nav.settings') }}</a>
      <a href="/logout">{{ t('nav.logout') }}</a>
    </nav>
  </header>
  {% endblock %}
  <main>
    {% for m in flash %}
      <div class="flash flash-{{ m.level }}">{{ m.text }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
