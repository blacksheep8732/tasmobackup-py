{% extends "base.html" %}
{% block title %}: Login{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="card" style="max-width:340px;margin:8vh auto;">
  <h2 style="margin-top:0;">🔌 TasmoBackup</h2>
  {% if error %}<p style="color:var(--danger);">{{ t('login.invalid') }}</p>{% endif %}
  <form method="post" action="/login">
    <p><input name="username" placeholder="{{ t('login.user') }}" autofocus style="width:100%;"></p>
    <p><input name="password" type="password" placeholder="{{ t('login.password') }}" style="width:100%;"></p>
    <button class="btn btn-primary" type="submit" style="width:100%;">{{ t('login.button') }}</button>
  </form>
</div>
{% endblock %}
